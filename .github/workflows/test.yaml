name: Run Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore F1Fantasy/F1Fantasy.sln
      
    - name: Build solution
      run: dotnet build F1Fantasy/F1Fantasy.sln --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test F1Fantasy/Tests/Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      